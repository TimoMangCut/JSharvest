title = "jsharvest gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures, historical deleted session log, and documented placeholder keys"
paths = [
  '''^testbed/(?:apps|lab|cmd/testbed)/''',
  '''_test\.go$''',
  '''^docs/session-2026-11-02\.jsonl$''',
]
regexes = [
  '''AIzaSyDUMMY0+''',
  '''lab-test-(?:key|secret)-0+''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxIn0\.sigabcdef123456''',
]
