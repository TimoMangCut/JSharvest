  // string, links written as HTML, an API call never made.
  document.getElementById('host').attachShadow({ mode: 'closed' }).innerHTML = '<a href="/pages/shadow.html">shadow</a>';
  var built = document.createElement('a');
  built.href = '/pages/' + 'js-built.html';
  built.textContent = 'built';
  document.getElementById('app').appendChild(built);
  var later = '/pages/js-string.html';
  var html = '<a href="/pages/inner.html">inner</a>';
  var routes = [{ path: '/pages/route-page' }];
  function never() { return fetch('/api/things', { method: 'GET' }); }
  window.app = { later: later, html: html, routes: routes, never: never };
  console.debug('JSHMARK:entry:main');
