<!doctype html><title>Log in</title>
<form id="f"><input id="email" name="email" type="email"><input id="password" name="password" type="password"><button id="go">Log in</button></form>
<p id="msg"></p>
<script>
  // A single-page login: a token in localStorage, a per-tab value in
  // sessionStorage, then on to the members' pages.
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await fetch('/api/login', { method: 'POST', body: new URLSearchParams(new FormData(e.target)) });
    if (!r.ok) { document.getElementById('msg').textContent = 'bad credentials'; return; }
    const j = await r.json();
    localStorage.setItem('auth', j.token);
    sessionStorage.setItem('tab', 'tab-' + Date.now());
    location.href = '/members/home';
  });
</script>
